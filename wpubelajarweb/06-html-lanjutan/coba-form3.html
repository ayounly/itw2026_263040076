<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select & Textarea</title>
</head>

<body>
    <form>
        <h3>Pilih Kota</h3>
        <select name="kota" id="kota">
            <option>-- Pilih salah satu --</option>
            <option value="sby" selected>Surabaya</option>
            <option value="bdg">Bandung</option>
            <option value="jkt">Jakarta</option>
            <option value="ygy">Yogyakarta</option>
        </select>
        <br>

        <h3>About Me:</h3>
        <textarea name="about" id="about" cols="50" rows="10" placeholder="Tulis tentang dirimu disini..."></textarea>

        <br><br>

        <button type="submit">Kirim!</button>
    </form>
</body>

</html>
